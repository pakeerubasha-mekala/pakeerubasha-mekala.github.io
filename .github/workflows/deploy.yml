name: Deploy (GitHub Pages + Cloudflare)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Cloudflare deploy stays dormant until CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID are set
    # in repo Settings → Secrets and variables → Actions.
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for the /changelog page
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Rebuild the resume PDF from the current data so it never goes stale.
      - run: node scripts/make-pdf.mjs dist
      # Render the social preview cards (PNG) for every page and post, then drop the card pages.
      - run: node scripts/make-og.mjs dist
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      # Publish the same built dist/ to Cloudflare Pages (free *.pages.dev, global CDN).
      # Skipped automatically until the Cloudflare secret + project name are configured.
      - name: Deploy to Cloudflare Pages
        if: env.HAS_CLOUDFLARE == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=pakeeru --branch=main

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
